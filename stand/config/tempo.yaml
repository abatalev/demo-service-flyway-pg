stream_over_http_enabled: true
server:
  http_listen_port: 3200
  # grpc_listen_port: 3201
  log_level: warn
  # log_level: debug

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
    metadata_slo:
      duration_slo: 5s
      throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  # cut the headblock when this much time passes. this is being set for demo
  # purposes and should probably be left alone normally
  max_block_duration: 5m

compactor:
  compaction:
    # overall Tempo trace retention. set for demo purposes
    block_retention: 1h

storage:
  trace:
    backend: local                     # backend configuration to use
    wal:
      path: /var/tempo/wal             # where to store the wal locally
    local:
      path: /var/tempo/blocks
