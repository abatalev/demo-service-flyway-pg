services:
  - id: things-service
    name: "Things Service"
    sources_url_pattern: "http://repo.example.com/things/{{service}}/{{version}}/sources.jar"
    versions:
      - version: "0.0.1"
        source_path: /app/data/things-service/sources
        class_path: /app/data/things-service/classes
    instances:
      - host: things-service
        port: 6300
        version: "0.0.1"   
    poll_interval: 60s

  - id: things-stub
    name: "Things Stub"
    versions:
      - version: "0.0.1"
        source_path: /app/data/things-stub/sources
        class_path: /app/data/things-stub/classes
    instances:
      - host: things-stub
        port: 6300
        version: "0.0.1"
    poll_interval: 30s